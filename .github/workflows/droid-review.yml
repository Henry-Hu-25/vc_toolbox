name: Droid Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Classifies the PR diff once, so the generic reviewer can pick a depth and each
  # specialist droid can decide whether it has anything to look at.
  scope:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      contracts: ${{ steps.classify.outputs.contracts }}
      pipeline: ${{ steps.classify.outputs.pipeline }}
      async: ${{ steps.classify.outputs.async }}
      web: ${{ steps.classify.outputs.web }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: classify
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$BASE_REF"
          files="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "Changed files:"
          printf '%s\n' "$files" | sed 's/^/  /'

          match() {
            if printf '%s\n' "$files" | grep -Eq "$1"; then echo true; else echo false; fi
          }

          SRC='founding_team_analyzer/src/founding_team_analyzer'
          echo "Classification:"
          {
            echo "backend=$(match "^founding_team_analyzer/")"
            echo "contracts=$(match "^($SRC/(schemas|events|runs|server)\.py|web/lib/(types|api|run-store)\.ts)$")"
            echo "pipeline=$(match "^$SRC/(nodes/|tools/|graph\.py|streaming_graph\.py|llm\.py|config\.py|scoring\.py|state\.py)")"
            echo "async=$(match "^($SRC/(runs|server|streaming_graph)\.py|founding_team_analyzer/tests/test_(concurrent|cross_area|runs_registry|server|delete_nonblocking|registry_eviction|event_ordering|per_run_state|streaming_graph))")"
            echo "web=$(match "^web/")"
          } | tee -a "$GITHUB_OUTPUT"

  # Factory's built-in two-pass correctness review plus the security review.
  # Repo-specific rules come from .factory/skills/review-guidelines/SKILL.md,
  # which the action picks up from the checkout automatically.
  review:
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          automatic_security_review: true
          # The subtle bugs in this repo live in the asyncio/SSE/registry layer, so pay
          # for deep reasoning only when Python changed.
          review_depth: ${{ needs.scope.outputs.backend == 'true' && 'deep' || 'shallow' }}

  # Specialist fleet. Each leg runs one droid from .factory/droids/ against a diff
  # scoped to that droid's paths, and posts its own sticky comment so re-runs update in
  # place instead of piling up.
  specialists:
    needs: scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - droid: contract-mirror-reviewer
            title: Contract mirror
            in_scope: ${{ needs.scope.outputs.contracts }}
            paths: >-
              founding_team_analyzer/src/founding_team_analyzer/schemas.py
              founding_team_analyzer/src/founding_team_analyzer/events.py
              founding_team_analyzer/src/founding_team_analyzer/runs.py
              founding_team_analyzer/src/founding_team_analyzer/server.py
              web/lib/types.ts
              web/lib/api.ts
              web/lib/run-store.ts
          - droid: pipeline-invariants-reviewer
            title: Pipeline invariants
            in_scope: ${{ needs.scope.outputs.pipeline }}
            paths: founding_team_analyzer/src/founding_team_analyzer
          - droid: async-lifecycle-reviewer
            title: Async lifecycle
            in_scope: ${{ needs.scope.outputs.async }}
            paths: >-
              founding_team_analyzer/src/founding_team_analyzer/runs.py
              founding_team_analyzer/src/founding_team_analyzer/server.py
              founding_team_analyzer/src/founding_team_analyzer/streaming_graph.py
              founding_team_analyzer/tests
          - droid: web-store-reviewer
            title: Frontend store
            in_scope: ${{ needs.scope.outputs.web }}
            paths: web
    steps:
      # Prints the resolved gate value so an unresolved expression (which would look
      # identical to "nothing in scope") is visible in the log rather than silent.
      - name: Report skip
        if: matrix.in_scope != 'true'
        env:
          IN_SCOPE: ${{ matrix.in_scope }}
        run: |
          echo "Skipping ${{ matrix.droid }}: in_scope='$IN_SCOPE' (expected 'true' to run)."
          if [ -z "$IN_SCOPE" ]; then
            echo "::warning title=Scope gate unresolved::in_scope was empty for ${{ matrix.droid }}; check the scope job outputs."
          fi

      - name: Checkout repository
        if: matrix.in_scope == 'true'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build scoped diff
        id: diff
        if: matrix.in_scope == 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PATHS: ${{ matrix.paths }}
          MAX_BYTES: "400000"
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "$BASE_REF"
          # Intentional word splitting: PATHS is a space-separated pathspec list.
          # shellcheck disable=SC2086
          git diff --unified=5 "origin/$BASE_REF...HEAD" -- $PATHS > "$RUNNER_TEMP/pr.diff"

          bytes=$(wc -c < "$RUNNER_TEMP/pr.diff")
          if [ "$bytes" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$bytes" -gt "$MAX_BYTES" ]; then
            head -c "$MAX_BYTES" "$RUNNER_TEMP/pr.diff" > "$RUNNER_TEMP/pr.diff.trunc"
            printf '\n\n[diff truncated at %s bytes of %s]\n' "$MAX_BYTES" "$bytes" \
              >> "$RUNNER_TEMP/pr.diff.trunc"
            mv "$RUNNER_TEMP/pr.diff.trunc" "$RUNNER_TEMP/pr.diff"
          fi
          echo "empty=false" >> "$GITHUB_OUTPUT"
          echo "Scoped diff: $bytes bytes"

      - name: Install Droid CLI
        if: matrix.in_scope == 'true' && steps.diff.outputs.empty == 'false'
        run: |
          set -euo pipefail
          curl --retry 5 --retry-delay 2 --retry-all-errors -fsSL https://app.factory.ai/cli | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/droid" --version

      - name: Run specialist review
        id: run
        if: matrix.in_scope == 'true' && steps.diff.outputs.empty == 'false'
        env:
          FACTORY_API_KEY: ${{ secrets.FACTORY_API_KEY }}
          DROID_NAME: ${{ matrix.droid }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          droid_file=".factory/droids/$DROID_NAME.md"
          if [ ! -f "$droid_file" ]; then
            echo "::error title=Missing droid definition::$droid_file not found"
            exit 1
          fi

          # The droid file is the single source of truth: its body becomes the system
          # prompt and its frontmatter supplies the model. We do not delegate through
          # the Task tool here, because Task is only available under --auto high, which
          # would hand a read-only reviewer write and remote access.
          model="$(awk '/^---$/{n++; next} n==1 && /^model:/{print $2; exit}' "$droid_file")"
          effort="$(awk '/^---$/{n++; next} n==1 && /^reasoningEffort:/{print $2; exit}' "$droid_file")"
          awk 'BEGIN{n=0} /^---$/{n++; next} n>=2{print}' "$droid_file" > "$RUNNER_TEMP/system.md"

          cat > "$RUNNER_TEMP/prompt.txt" <<PROMPT
          Review the diff for pull request #$PR_NUMBER in this repository. The diff is
          saved at $RUNNER_TEMP/pr.diff. Read that file first. It contains only the
          changed files that fall inside your area of responsibility. Read any
          repository file you need in order to judge the change correctly.

          Follow your review contract exactly, including the output format and the
          maximum of three findings. Output only the review: no preamble, no summary of
          what you did, and no commentary outside the contract.
          PROMPT

          # Read-only tool set, mirroring the tools field in every specialist droid.
          args=(--output-format json
                --restrict-tools "Read,LS,Grep,Glob"
                --append-system-prompt-file "$RUNNER_TEMP/system.md")
          [ -n "$model" ] && args+=(-m "$model")
          [ -n "$effort" ] && args+=(-r "$effort")

          droid exec "${args[@]}" -f "$RUNNER_TEMP/prompt.txt" \
            > "$RUNNER_TEMP/out.json" 2> "$RUNNER_TEMP/err.log"
          exit_code=$?

          if ! result="$(jq -er '.result // empty' "$RUNNER_TEMP/out.json" 2>/dev/null)"; then
            echo "::warning title=Specialist review unavailable::$DROID_NAME returned no parsable result (exit $exit_code)"
            tail -n 30 "$RUNNER_TEMP/err.log" || true
            echo "status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$(jq -r '.is_error // false' "$RUNNER_TEMP/out.json")" = "true" ]; then
            echo "::warning title=Specialist review failed::$DROID_NAME reported an error"
            printf '%s\n' "$result"
            echo "status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$(printf '%s' "$result" | tr -d '[:space:]')" ]; then
            echo "::warning title=Specialist review empty::$DROID_NAME returned an empty result"
            echo "status=unavailable" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          printf '%s\n' "$result" > "$RUNNER_TEMP/result.md"
          if grep -qx 'NO_FINDINGS' "$RUNNER_TEMP/result.md"; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=findings" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or update review comment
        if: |
          matrix.in_scope == 'true' &&
          (steps.run.outputs.status == 'findings' || steps.run.outputs.status == 'clean')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DROID_NAME: ${{ matrix.droid }}
          TITLE: ${{ matrix.title }}
          STATUS: ${{ steps.run.outputs.status }}
        run: |
          set -euo pipefail
          marker="<!-- droid-specialist: $DROID_NAME -->"

          gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate > "$RUNNER_TEMP/comments.json"
          existing="$(jq -r --arg m "$marker" \
            '[.[] | select(.body | startswith($m))] | last | .id // empty' \
            "$RUNNER_TEMP/comments.json")"

          # A clean result only ever updates an existing comment. It never creates one,
          # so a passing specialist stays invisible.
          if [ "$STATUS" = "clean" ] && [ -z "$existing" ]; then
            echo "Clean and no prior comment; nothing to post."
            exit 0
          fi

          {
            printf '%s\n' "$marker"
            printf '### %s\n\n' "$TITLE"
            if [ "$STATUS" = "clean" ]; then
              printf 'No findings as of `%s`.\n' "$HEAD_SHA"
            else
              cat "$RUNNER_TEMP/result.md"
            fi
            printf '\n<sub>Specialist droid `%s` &middot; commit `%s`</sub>\n' \
              "$DROID_NAME" "$HEAD_SHA"
          } > "$RUNNER_TEMP/body.md"

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F "body=@$RUNNER_TEMP/body.md"
            echo "Updated comment $existing"
          else
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file "$RUNNER_TEMP/body.md"
            echo "Posted new comment"
          fi
